name: Validate infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce human-machine documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          if find docs -type f ! -name '*.md' -print -quit | grep -q .; then
            echo 'docs/ is human-readable Markdown only' >&2
            exit 1
          fi
          if find project -type f ! \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) -print -quit | grep -q .; then
            echo 'project/ is machine-readable YAML/JSON only' >&2
            exit 1
          fi
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.3'
      - name: Terraform format
        run: terraform fmt -check -recursive terraform
      - name: Terraform validate modules
        shell: bash
        run: |
          set -euo pipefail
          for module in terraform/modules/*; do
            echo "Validating ${module}"
            terraform -chdir="${module}" init -backend=false -input=false
            terraform -chdir="${module}" validate
          done
